<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebGPU Smoke Test</title>
  <style>
    body{font-family:Segoe UI,Tahoma,sans-serif;margin:32px;background:#f5f3ed;color:#111827}
    canvas{display:block;width:min(720px,100%);aspect-ratio:4/3;border:1px solid #c8c1b2;background:#0b1020}
    pre{max-width:720px;white-space:pre-wrap;background:#fff;border:1px solid #ddd4c4;padding:12px}
  </style>
</head>
<body>
  <h1>WebGPU Smoke Test</h1>
  <canvas id="canvas" width="720" height="540"></canvas>
  <pre id="status">Starting...</pre>
  <script>
    const statusEl = document.getElementById("status");
    const log = (...lines) => {
      statusEl.textContent = lines.join("\n");
    };

    async function main() {
      log(
        `protocol=${location.protocol}`,
        `secureContext=${window.isSecureContext}`,
        `navigator.gpu=${Boolean(navigator.gpu)}`
      );

      if (!navigator.gpu) {
        log(statusEl.textContent, "FAIL: navigator.gpu is not available.");
        return;
      }

      const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
      if (!adapter) {
        log(statusEl.textContent, "FAIL: requestAdapter() returned null.");
        return;
      }

      const device = await adapter.requestDevice();
      const canvas = document.getElementById("canvas");
      const context = canvas.getContext("webgpu");
      const format = navigator.gpu.getPreferredCanvasFormat();
      context.configure({ device, format, alphaMode: "opaque" });

      const encoder = device.createCommandEncoder();
      const pass = encoder.beginRenderPass({
        colorAttachments: [{
          view: context.getCurrentTexture().createView(),
          loadOp: "clear",
          clearValue: { r: 0.05, g: 0.45, b: 0.68, a: 1 },
          storeOp: "store",
        }],
      });
      pass.end();
      device.queue.submit([encoder.finish()]);

      log(
        statusEl.textContent,
        "PASS: WebGPU adapter and device are working.",
        `format=${format}`
      );
    }

    main().catch(error => {
      log(statusEl.textContent, `ERROR: ${error.message || error}`);
      console.error(error);
    });
  </script>
</body>
</html>
